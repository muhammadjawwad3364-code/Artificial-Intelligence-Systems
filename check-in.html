<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-In</title>
<style>
  :root{
    --bg:#0c0a1a; --panel:#171330cc; --line:#3a2f6b;
    --text:#f1eefc; --muted:#a79fce;
    --accent1:#a855f7; --accent2:#3b82f6;
    --accent-text:#ffffff;
    --good:#4fd1a5; --warn:#f0a35c; --warn-bg:#3d2a17; --bad:#f0616a;
    --glow1:rgba(168,85,247,0.35); --glow2:rgba(59,130,246,0.30);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%; margin:0; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 48px;
    background:
      radial-gradient(circle at 15% 10%, var(--glow1), transparent 45%),
      radial-gradient(circle at 85% 20%, var(--glow2), transparent 45%),
      radial-gradient(circle at 50% 90%, var(--glow1), transparent 50%),
      var(--bg);
    background-attachment:fixed;
  }
  h1{ font-size:1.3rem; font-weight:600; letter-spacing:0.2px; margin:0 0 4px; }
  .sub{color:var(--muted); font-size:0.92rem; margin:0 0 22px; text-align:center;}

  .top-btn{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); z-index:50;
    width:auto; margin-top:0;
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:20px;
    background:linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow:0 0 16px var(--glow1); border:none; color:var(--accent-text);
    font-size:0.8rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .prev-icon{
    right:16px;
    opacity:0; transform:translateY(-6px) scale(0.95); pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .prev-icon.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .all-icon{ left:16px; }

  .prev-overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(6,4,16,0.7); backdrop-filter:blur(4px);
    display:flex; align-items:flex-start; justify-content:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .3s ease, visibility 0s linear .3s;
  }
  .prev-overlay.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .3s ease;
  }
  .prev-panel{
    width:100%; max-width:820px;
    transform:scale(0.92); opacity:0;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
  }
  .prev-overlay.open .prev-panel{ transform:scale(1); opacity:1; }
  .prev-panel-inner{
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:14px; padding:18px;
    box-shadow:0 0 24px var(--glow2);
  }
  .prev-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .prev-head h3{ margin:0; font-size:0.95rem; font-weight:600; }
  .prev-close{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:#1c1738; color:var(--muted); cursor:pointer; font-size:0.9rem;
    display:flex; align-items:center; justify-content:center; padding:0; margin:0;
    box-shadow:none;
  }
  .prev-close:hover{ color:var(--text); }
  .day-head{ font-size:0.8rem; color:var(--muted); font-weight:600; margin:14px 0 2px; }
  .day-head:first-child{ margin-top:0; }

  .tabs{
    position:relative;
    display:flex; gap:6px; background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:10px; padding:4px;
    width:100%; max-width:420px; margin-bottom:16px;
  }
  .tab-slider{
    position:absolute; top:4px; left:4px;
    width:calc(50% - 7px); height:calc(100% - 8px);
    border-radius:7px;
    background:linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow:0 0 14px var(--glow1);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    transform:translateX(0);
  }
  .tabs.out .tab-slider{ transform:translateX(calc(100% + 6px)); }
  .tab{
    position:relative; z-index:1;
    flex:1; text-align:center; padding:10px 0; border-radius:7px; cursor:pointer;
    font-size:0.92rem; font-weight:600; color:var(--muted);
    transition:color .3s ease;
    user-select:none;
  }
  .tab.active{ color:var(--accent-text); }

  .panel{
    width:100%; max-width:420px;
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:14px; padding:24px;
    box-shadow:0 0 30px var(--glow1);
    position:relative; overflow:hidden; isolation:isolate;
    min-height:250px; display:flex; flex-direction:column; justify-content:center;
  }
  #form{width:100%;}
  label{display:block; font-size:0.85rem; color:var(--muted); margin:0 0 10px; line-height:1.3;}
  input[type=text]{
    display:block; width:100%; padding:13px 14px; border-radius:9px;
    border:1px solid var(--line); background:#0f0c24; color:var(--text);
    font-size:1rem; outline:none;
  }
  /* Placeholder: same opacity, color pulses purple <-> blue like the theme */
  input[type=text]::placeholder{
    opacity:0.75;
    color:var(--accent1);
    animation:phPulse 2.4s ease-in-out infinite;
  }
  @keyframes phPulse{
    0%,100%{ color:#a855f7; text-shadow:0 0 8px rgba(168,85,247,0.45); }
    50%{ color:#3b82f6; text-shadow:0 0 8px rgba(59,130,246,0.45); }
  }
  input[type=text]:focus{ border-color:var(--accent2); box-shadow:0 0 0 3px var(--glow2); }
  button{
    margin-top:16px; width:100%; padding:13px 14px; border:none; border-radius:9px;
    background:linear-gradient(135deg, var(--accent1), var(--accent2));
    color:var(--accent-text); font-size:1rem; font-weight:600; cursor:pointer;
    box-shadow:0 0 14px var(--glow1);
  }
  button:active{transform:translateY(1px);}
  button:disabled{opacity:0.5; cursor:default;}
  .top-btn{ margin-top:0; width:auto; padding:8px 14px; font-size:0.8rem; border-radius:20px; box-shadow:0 0 16px var(--glow1); }
  .err{color:var(--bad); font-size:0.82rem; margin:10px 0 0; min-height:1em;}

  .success{
    position:absolute; inset:0; background:var(--panel); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .2s ease, visibility 0s linear .2s;
  }
  .success.show{opacity:1; visibility:visible; pointer-events:auto; transition:opacity .2s ease;}
  .check{
    width:64px; height:64px; border-radius:50%;
    border:2px solid var(--good); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 18px var(--good);
  }
  .check svg{width:30px; height:30px;}
  .check path{
    fill:none; stroke:var(--good); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:40; stroke-dashoffset:40;
    animation:draw .4s ease forwards .1s;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .success h2{margin:0; font-size:1.05rem; font-weight:600; text-align:center;}
  .success p{margin:0; color:var(--muted); font-size:0.88rem;}

  .log{width:100%; max-width:820px; margin-top:40px;}
  .log h3{font-size:0.9rem; color:var(--muted); font-weight:500; margin:0 0 12px; text-align:left;}
  .cards{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:10px;
    padding:14px 18px; display:flex; align-items:center; gap:16px; overflow-x:auto;
  }
  .card .dot{width:8px; height:8px; border-radius:50%; background:var(--good); flex:none; box-shadow:0 0 6px var(--good);}
  .card .dot.open{background:var(--accent2); box-shadow:0 0 6px var(--accent2);}
  .field{display:flex; flex-direction:column; gap:4px; min-width:100px; flex:none;}
  .field .k{font-size:0.72rem; color:var(--muted);}
  .field .v{font-size:0.95rem; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:6px;}
  .tag{
    font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:20px;
    background:var(--warn-bg); color:var(--warn); white-space:nowrap;
  }
  .empty{color:var(--muted); font-size:0.9rem; text-align:left; padding:8px 2px;}

  .refresh-wrap{ width:100%; max-width:420px; margin-top:26px; }
  .refresh-btn{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    box-shadow:none; font-weight:600;
  }
  .refresh-btn:hover{ color:var(--text); border-color:var(--accent2); }
</style>
</head>
<body>

  <h1 id="heading">Check-In</h1>
  <p class="sub" id="subtext">Enter your ID and confirm your arrival.</p>

  <button class="top-btn all-icon" id="allIcon">📅 View all data</button>
  <button class="top-btn prev-icon" id="prevIcon">🕓 View previous data</button>
  <div class="prev-overlay" id="prevOverlay">
    <div class="prev-panel" id="prevPanel">
      <div class="prev-panel-inner">
        <div class="prev-head">
          <h3 id="prevTitle">Previous day's data</h3>
          <button class="prev-close" id="prevClose">✕</button>
        </div>
        <div class="cards" id="prevCards"></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabsWrap">
    <div class="tab-slider"></div>
    <div class="tab active" id="tabIn">Check In</div>
    <div class="tab" id="tabOut">Check Out</div>
  </div>

  <div class="panel">
    <div id="form">
      <label for="idInput">Employee ID</label>
      <input type="text" id="idInput" placeholder="Enter Your Identity" autocomplete="off">
      <button id="submitBtn">Check In</button>
      <p class="err" id="errMsg"></p>
    </div>
    <div class="success" id="success">
      <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5 11-11"/></svg></div>
      <h2 id="successTitle">You're now checked in</h2>
      <p id="successDetail"></p>
    </div>
  </div>

  <div class="log">
    <h3 id="logTitle">Today's check-ins</h3>
    <div class="cards" id="cards"></div>
  </div>

  <div class="refresh-wrap">
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>

<script>
  // Every day, relative to the current date:
  const LATE_HOUR = 13, LATE_MIN = 0;   // check-in time: 1:00 PM
  const OT_HOUR = 13, OT_MIN = 30;      // check-out time: 1:30 PM
  const STORE_KEY = 'checkin_all_v1';

  // all = every record ever saved. state: 0 = live, 1 = previous, 2 = older
  let all = [];
  let mode = 'in';

  const $ = id => document.getElementById(id);
  const idInput=$('idInput'), submitBtn=$('submitBtn'), success=$('success'),
    successTitle=$('successTitle'), successDetail=$('successDetail'), cards=$('cards'),
    logTitle=$('logTitle'), errMsg=$('errMsg'), heading=$('heading'), subtext=$('subtext'),
    tabIn=$('tabIn'), tabOut=$('tabOut'), tabsWrap=$('tabsWrap'), refreshBtn=$('refreshBtn'),
    prevIcon=$('prevIcon'), allIcon=$('allIcon'), prevOverlay=$('prevOverlay'),
    prevClose=$('prevClose'), prevCards=$('prevCards'), prevTitle=$('prevTitle');

  // ---------- persistence ----------
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(all)); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      all = JSON.parse(raw).map(r => ({
        ...r,
        inTime: new Date(r.inTime),
        outTime: r.outTime ? new Date(r.outTime) : null
      }));
    }catch(e){ all = []; }
  }
  const live = () => all.filter(r => r.state === 0);
  const prev = () => all.filter(r => r.state === 1);

  // ---------- helpers ----------
  function fmtTime(d){
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  function threshold(d, h, m){
    const t = new Date(d); t.setHours(h, m, 0, 0); return t;
  }
  function isAfter(d, h, m){ return d > threshold(d, h, m); }
  function minutesPast(d, h, m){
    return Math.max(1, Math.ceil((d - threshold(d, h, m)) / 60000));
  }
  function fmtDuration(mins){
    if(mins <= 59) return `${mins}m`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m === 0 ? `${h}h` : `${h}h ${m}m`;
  }
  const sameDay = (a, b) => a.toDateString() === b.toDateString();

  function setMode(next){
    mode = next;
    tabIn.classList.toggle('active', mode === 'in');
    tabOut.classList.toggle('active', mode === 'out');
    tabsWrap.classList.toggle('out', mode === 'out');
    submitBtn.textContent = mode === 'in' ? 'Check In' : 'Check Out';
    heading.textContent = mode === 'in' ? 'Check-In' : 'Check-Out';
    subtext.textContent = mode === 'in'
      ? 'Enter your ID and confirm your arrival.'
      : 'Enter your ID and confirm your departure.';
    errMsg.textContent = '';
    idInput.value = '';
    idInput.focus();
  }
  tabIn.addEventListener('click', () => setMode('in'));
  tabOut.addEventListener('click', () => setMode('out'));

  function cardRow(r, orderNum){
    return `
      <div class="card">
        <div class="dot ${r.outTime ? '' : 'open'}"></div>
        <div class="field"><span class="k">Order</span><span class="v">#${orderNum}</span></div>
        <div class="field"><span class="k">Employee ID</span><span class="v">${r.id}</span></div>
        <div class="field"><span class="k">Check-in</span><span class="v">${fmtTime(r.inTime)} ${r.late ? `<span class="tag">Late ${fmtDuration(r.lateMins)}</span>` : ''}</span></div>
        <div class="field"><span class="k">Check-out</span><span class="v">${r.outTime ? fmtTime(r.outTime) : '—'} ${r.overtime ? `<span class="tag">Overtime ${fmtDuration(r.otMins)}</span>` : ''}</span></div>
        <div class="field"><span class="k">Date</span><span class="v">${r.inTime.toLocaleDateString()}</span></div>
      </div>`;
  }

  function render(){
    const rows = live();
    logTitle.textContent = rows.length ? `Today's activity (${rows.length})` : `Today's activity`;
    cards.innerHTML = rows.length
      ? rows.slice().reverse().map((r, idx) => cardRow(r, rows.length - idx)).join('')
      : `<div class="empty">No activity yet.</div>`;
    prevIcon.classList.toggle('show', prev().length > 0);
  }

  function showSuccess(title, detail){
    successTitle.textContent = title;
    successDetail.textContent = detail;
    success.classList.add('show');
    submitBtn.disabled = true;
    setTimeout(() => {
      success.classList.remove('show');
      submitBtn.disabled = false;
      idInput.value = '';
      idInput.focus();
    }, 1400);
  }

  function showError(msg){
    errMsg.textContent = msg;
    idInput.focus();
    idInput.style.borderColor = 'var(--bad)';
    setTimeout(() => idInput.style.borderColor = '', 900);
  }

  function doCheckIn(id){
    const time = new Date();
    const late = isAfter(time, LATE_HOUR, LATE_MIN);
    const lateMins = late ? minutesPast(time, LATE_HOUR, LATE_MIN) : 0;
    all.push({ id, inTime: time, outTime: null, late, lateMins, overtime: false, otMins: 0, state: 0 });
    save(); render();
    showSuccess("You're now checked in", `ID ${id} · ${fmtTime(time)}${late ? ` · Late ${fmtDuration(lateMins)}` : ''}`);
  }

  function doCheckOut(id){
    const now = new Date();
    const rec = [...all].reverse().find(r => r.id === id && !r.outTime && sameDay(r.inTime, now));
    if(!rec){ showError(`No open check-in found for ID ${id}.`); return; }
    rec.outTime = now;
    rec.overtime = isAfter(now, OT_HOUR, OT_MIN);
    rec.otMins = rec.overtime ? minutesPast(now, OT_HOUR, OT_MIN) : 0;
    save(); render();
    showSuccess("You're now checked out", `ID ${id} · ${fmtTime(now)}${rec.overtime ? ` · Overtime ${fmtDuration(rec.otMins)}` : ''}`);
  }

  function handleSubmit(){
    errMsg.textContent = '';
    const id = idInput.value.trim();
    if(!id){ showError('Enter an employee ID.'); return; }
    if(mode === 'in') doCheckIn(id); else doCheckOut(id);
  }
  submitBtn.addEventListener('click', handleSubmit);
  idInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleSubmit(); });

  // Refresh: live rows become "previous"; old previous rows move to history (still kept in View all data)
  refreshBtn.addEventListener('click', () => {
    if(live().length){
      all.forEach(r => { if(r.state === 1) r.state = 2; });
      all.forEach(r => { if(r.state === 0) r.state = 1; });
      save();
    }
    render();
    closeOverlay();
  });

  // ---------- overlay ----------
  function openOverlay(title, html){
    prevTitle.textContent = title;
    prevCards.innerHTML = html;
    prevOverlay.classList.add('open');
  }
  function closeOverlay(){ prevOverlay.classList.remove('open'); }

  function openPrev(){
    const rows = prev();
    openOverlay("Previous day's data", rows.length
      ? rows.slice().reverse().map((r, idx) => cardRow(r, rows.length - idx)).join('')
      : `<div class="empty">Nothing to show yet.</div>`);
  }

  function openAll(){
    const now = new Date();
    const month = all.filter(r => r.inTime.getMonth() === now.getMonth() && r.inTime.getFullYear() === now.getFullYear());
    const title = `All data · ${now.toLocaleDateString([], {month:'long', year:'numeric'})} (${month.length})`;
    if(!month.length){ openOverlay(title, `<div class="empty">No data saved for this month yet.</div>`); return; }
    let html = '', lastDay = '';
    month.map((r, i) => ({ r, n: i + 1 })).reverse().forEach(({ r, n }) => {
      const day = r.inTime.toDateString();
      if(day !== lastDay){
        html += `<div class="day-head">${r.inTime.toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'})}</div>`;
        lastDay = day;
      }
      html += cardRow(r, n);
    });
    openOverlay(title, html);
  }

  prevIcon.addEventListener('click', () => {
    if(prevOverlay.classList.contains('open') && prevTitle.textContent.startsWith('Previous')) closeOverlay(); else openPrev();
  });
  allIcon.addEventListener('click', () => {
    if(prevOverlay.classList.contains('open') && prevTitle.textContent.startsWith('All')) closeOverlay(); else openAll();
  });
  prevClose.addEventListener('click', closeOverlay);
  prevOverlay.addEventListener('click', e => { if(e.target === prevOverlay) closeOverlay(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeOverlay(); });

  load();
  render();
</script>
</body>
</html>
